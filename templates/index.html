<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factores de Interés</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5 text-center">
    <h1 class="mb-4">Factores de Interés</h1>
    <p class="lead">Bienvenido a la aplicación de factores de interés. Aquí puedes generar tablas de factores para diferentes tasas de interés y períodos.</p>
    <div class="card p-4 shadow mx-auto" style="max-width: 500px;"> 
        <form action="{{ url_for('generar') }}" method="post">
            <div class="mb-3">
                <label for="interes" class="form-label">Tasa de Interés (%)</label>
                <input type="number" step="0.01" class="form-control" id="interes" name="interes" required>
            </div>   
            <div class="mb-3">
                <label for="n_max" class="form-label">Valor de N periodos</label>
                <input type="number" class="form-control" id="n_max" name="n_max" required>
            </div>
            <div class="mb-3"> 
                <label for="modo" class="form-label">Tipo de visualización</label>
                <select class="form-select" id="modo" name="modo" required>
                    <option value="hasta">Mostrar tabla hasta n</option>
                    <option value="fila">Mostrar fila específica de n</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Generar Factores</button>
        </form>
    </div>
</body>    
</html>
